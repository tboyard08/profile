<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>My profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.2/css/all.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>
    <div class="container">
      <div class="home-card">
        <header>
          <h1>Hello, i'm Tommy!</h1>
          <img src="images/tom.png" alt="Tommy's profile photo" id="home-page-first-image">
          <h2>IT developer</h2>
        </header>
        <main>
          <p>
            I'am a full-stack PHP developer (Laravel) who joined Le Wagon from Haiti.
            I creates solutions to improve business operations.
            I enjoys technology, innovation, and problem-solving.
          </p>
          <button class="portfolio-btn">My Portfolio</button>
        </main>
      </div>
      <div class="home-card">
        <footer>
          <span>Follow me</span>
          <ul class="list-inline">
            <li>
              <a href="#">
                <i class="fab fa-facebook-f"></i> Facebook
              </a>
            </li>
            <li>
              <a href="https://www.linkedin.com/in/tboyard/" target="_blank">
                <i class="fa-brands fa-linkedin"></i> Linkedin
              </a>
            </li>
            <li>
              <a href="#">
                <i class="fab fa-twitter"></i> Twitter
              </a>
            </li>
          </ul>
        </footer>
      </div>
    </div>
  </body>
</html>
